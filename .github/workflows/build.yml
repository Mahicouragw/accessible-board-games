name: Web Build + Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['android-*']

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck and lint
        run: |
          npm run typecheck
          npm run lint
      - name: Test deterministic game movement
        run: node --test tests/stepMove.test.js
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: accessible-board-games-web
          path: .next/

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure Android platform
        working-directory: flutter_apk
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.mahicouragw --project-name board_games .
          fi
          flutter pub get
      - name: Build Flutter wrapper APK
        working-directory: flutter_apk
        run: flutter build apk --debug
      - name: Normalize APK filename
        run: cp flutter_apk/build/app/outputs/flutter-apk/app-debug.apk AccessibleBoardGames.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AccessibleBoardGames.apk
          path: AccessibleBoardGames.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/android-')
        uses: softprops/action-gh-release@v2
        with:
          files: AccessibleBoardGames.apk
          generate_release_notes: true
