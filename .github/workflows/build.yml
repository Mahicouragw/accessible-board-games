name: Web Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install --no-audit --no-fund
      - run: npm run build
